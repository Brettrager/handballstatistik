<!doctype html>
<html lang="de" class="nojs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handball Statistiken</title>
<meta name="theme-color" content="#1a1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HB Stats">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤾</text></svg>">
<style>
:root{
  --bg:#121417;--bg2:#1a1d22;--card:#20242b;--line:#2e333b;--text:#e8eaed;--muted:#9aa1ab;
  --accent:#f5a623;--accent2:#ffcf70;--win:#3fb950;--draw:#d29922;--loss:#f85149;--home:#58a6ff;--guest:#f78166;
  --fav:rgba(245,166,35,.12);--shadow:0 1px 3px rgba(0,0,0,.4);
}
:root.light{
  --bg:#f4f5f7;--bg2:#ffffff;--card:#ffffff;--line:#dfe2e6;--text:#1c1f24;--muted:#5f6670;
  --accent:#c77700;--accent2:#995c00;--fav:rgba(245,166,35,.16);--shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
a.link{color:var(--accent2)} a.link:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.5px;font-size:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand span{color:var(--accent)}
.search{position:relative;flex:1;min-width:180px;max-width:420px}
.search input{width:100%;padding:8px 12px 8px 32px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.search:before{content:"⌕";position:absolute;left:10px;top:5px;color:var(--muted);font-size:18px}
.suggest{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:4px;box-shadow:var(--shadow);max-height:360px;overflow:auto;display:none}
.suggest a{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line)}
.suggest a:hover,.suggest a.active{background:var(--fav)}
.suggest small{color:var(--muted)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
nav.leagues{max-width:1280px;margin:0 auto;padding:0 16px 8px;display:flex;flex-direction:column;gap:6px}
.lgrow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.lgrow::-webkit-scrollbar{display:none}
.lgsep{width:1px;height:20px;background:var(--muted);opacity:.5;margin:0 5px;flex:none}
.lgrow b{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);min-width:58px;flex:none}
.lgrow a{padding:3px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;white-space:nowrap;color:var(--muted);flex:none}
.lgrow a:hover{border-color:var(--accent);color:var(--text)}
.lgrow a.active{background:var(--accent);border-color:var(--accent);color:#16181c;font-weight:700}
.lgrow a.hasfav:after{content:" ★";color:var(--accent)}
.lgrow a.active.hasfav:after{color:#16181c}
nav.tabs{max-width:1280px;margin:0 auto;display:flex;gap:4px;padding:0 16px;overflow-x:auto}
nav.tabs a{padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;font-weight:600}
nav.tabs a.active{color:var(--text);border-color:var(--accent)}
@media(max-width:640px){header.top{position:static}}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:.3px}
h2{font-size:18px;margin:26px 0 10px}
.sub{color:var(--muted);margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px;min-width:0}
h1{overflow-wrap:anywhere}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);max-width:100%;overflow-wrap:anywhere}
.chip a{color:var(--accent2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:10px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.card .v{font-size:24px;font-weight:700;margin-top:2px}
.card .d{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 10px}
.toolbar input,.toolbar select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg2)}
.toolbar label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--bg2);border:0;padding:7px 11px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:#111;font-weight:600}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--bg2);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;user-select:none;z-index:1}
th[data-k]:not([data-k=""]){cursor:pointer}
th.l,td.l{text-align:left}
th.sorted{color:var(--accent)}
th.sorted:after{content:" ▾"} th.sorted.asc:after{content:" ▴"}
th[title]{text-decoration:underline dotted var(--line)}
td.sortcol{background:rgba(245,166,35,.07);font-weight:600}
tbody tr:hover{background:rgba(127,127,127,.08)}
tr.fav{background:var(--fav)}
tfoot td{font-weight:700;background:var(--bg2);border-top:2px solid var(--line)}
td.name a{font-weight:600}
td .tm{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.res{display:inline-block;min-width:22px;text-align:center;border-radius:5px;padding:1px 6px;font-weight:700;font-size:12px;color:#fff}
.res.S{background:var(--win)}.res.U{background:var(--draw)}.res.N{background:var(--loss)}
.score{font-weight:700;font-size:15px}
.games .g{display:grid;grid-template-columns:120px 1fr 80px 1fr 40px;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.games .g:hover{background:rgba(127,127,127,.08)}
.games .g .h{text-align:right}
.games .g .s{text-align:center}
.games .g.fav{background:var(--fav)}
.games .day{padding:8px 12px;background:var(--bg2);color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
@media(max-width:640px){.games .g{grid-template-columns:1fr 64px 1fr;font-size:13px}.games .g .t,.games .g .r{display:none}}
.win{font-weight:700}
.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;text-align:center;padding:18px}
.scoreboard .team{overflow-wrap:anywhere}
@media(max-width:640px){.panel.scoreboard{gap:8px;padding:12px}.panel.scoreboard .big{font-size:32px}.panel.scoreboard .team{font-size:15px}}
.scoreboard .big{font-size:44px;font-weight:800;letter-spacing:2px}
.scoreboard .team{font-size:18px;font-weight:700}
.timeline{max-height:520px;overflow:auto}
.ev{display:grid;grid-template-columns:52px 60px 1fr;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line);font-size:13px}
.ev.home{border-left:3px solid var(--home)} .ev.guest{border-left:3px solid var(--guest)}
.ev .t{color:var(--muted)} .ev .sc{font-weight:700;text-align:center}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:4px;font-weight:700}
.b-2min{background:#6e40c9;color:#fff}.b-warn{background:#d29922;color:#111}.b-disq{background:#f85149;color:#fff}.b-7m{background:#1f6feb;color:#fff}.b-miss{background:#57606a;color:#fff}.b-to{background:#30363d;color:#fff}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cmpbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--accent);color:#111;padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4);display:none;gap:12px;align-items:center;z-index:30}
.cmpbar button{background:#111;color:#fff;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.star{cursor:pointer;color:var(--muted);font-size:18px;background:none;border:0}
.star.on{color:var(--accent)}
.best{color:var(--accent);font-weight:800}
footer{max-width:1280px;margin:0 auto;padding:20px 16px 40px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--muted)}
.form{display:inline-flex;gap:3px}
.small{font-size:12px}
.records td{text-align:left;white-space:normal}
.records td:first-child{color:var(--muted);width:42%}
.nojs .search,.nojs #themeBtn,.nojs .tabs,.nojs .leagues,.nojs .cmpbar{display:none}
.nojs-note{margin:14px 0;padding:10px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--fav);font-size:13px}
.nojs td.name,.nojs th.name{text-align:left;white-space:normal}
.nojs th,.nojs td{padding:6px 7px}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/spieler" id="brand">🤾 Handball <span>Statistiken</span></a>
    <div class="search"><input id="q" placeholder="Spieler oder Mannschaft suchen…" autocomplete="off"><div class="suggest" id="suggest"></div></div>
    <button class="iconbtn" id="themeBtn" title="Hell/Dunkel umschalten">◐</button>
  </div>
  <nav class="leagues" id="leagues"></nav>
  <nav class="tabs" id="tabs">
    <a href="#/spieler" data-tab="spieler">Spieler</a>
    <a href="#/tabelle" data-tab="tabelle">Tabelle</a>
    <a href="#/spiele" data-tab="spiele">Spiele</a>
    <a href="#/liga" data-tab="liga">Ligastatistik</a>
  </nav>
</header>
<main id="app"><!--__STATIC__--></main>
<div class="cmpbar" id="cmpbar"><span id="cmpcount"></span><button id="cmpgo">Vergleichen</button><button id="cmpclear">✕</button></div>
<footer id="foot"></footer>
<script>
const DATA = /*__DATA__*/null;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt1 = n => (Math.round(n * 100) / 100).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = (a, b) => b ? Math.round(100 * a / b) + " %" : "–";
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const fdate = (d, wd=true) => { if (!d) return ""; const [y,m,dd] = d.split("-"); const w = WD[new Date(d + "T12:00").getDay()]; return (wd ? w + ", " : "") + `${dd}.${m}.${y.slice(2)}`; };
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("hs_" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("hs_" + k, JSON.stringify(v)); } catch {} }
};

let L, T, P, G;          // current league, teams by id, players by id, games by id
const state = {
  sort: {key: "goals", asc: false}, team: "", period: "all", minGames: 0, q: "", perGame: false,
  compare: new Set(), favs: new Set(store.get("favs", [])),
};

function setLeague(key) {
  L = DATA.leagues.find(l => l.key === key) || DATA.leagues[0];
  T = Object.fromEntries(L.teams.map(t => [t.id, t]));
  P = Object.fromEntries(L.players.map(p => [p.id, p]));
  G = Object.fromEntries(L.games.map(g => [g.id, g]));
  // Hin-/Rückrunde: the first meeting of a pairing belongs to the first half of the season
  const seen = new Set();
  for (const g of L.games) { const k = [g.home, g.guest].sort().join("|"); g.round = seen.has(k) ? 2 : 1; seen.add(k); }
  state.compare.clear();
  store.set("league", L.key);
}
const played = () => L.games.filter(g => g.parsed);
const teamName = id => T[id]?.name ?? "?";
const teamLink = (id, short=false) => `<a class="link" href="#/team/${id}">${esc(short ? T[id]?.short : teamName(id))}</a>`;
const playerLink = id => `<a href="#/player/${id}">${esc(P[id]?.name)}</a>`;
const resultFor = (g, teamId) => { const my = g.home === teamId ? g.hg : g.gg, op = g.home === teamId ? g.gg : g.hg; return my > op ? "S" : my < op ? "N" : "U"; };

// ---------- aggregation ----------
function gamesInPeriod(period) {
  const games = played();
  if (period === "home" || period === "away" || period === "all") return games;
  if (period === "r1") return games.filter(g => g.round === 1);
  if (period === "r2") return games.filter(g => g.round === 2);
  if (period === "last3") {
    const keep = new Set();
    for (const t of L.teams) games.filter(g => g.home === t.id || g.guest === t.id).slice(-3).forEach(g => keep.add(g.id + "|" + t.id));
    return games.map(g => ({...g, _keep: keep}));
  }
  return games;
}
function aggregate(period = "all") {
  const s = {};
  const games = gamesInPeriod(period);
  for (const g of games) {
    for (const side of ["home", "guest"]) {
      const tid = g[side];
      if (period === "home" && side !== "home") continue;
      if (period === "away" && side !== "guest") continue;
      if (g._keep && !g._keep.has(g.id + "|" + tid)) continue;
      for (const a of g.lineups[side]) {
        const x = s[a.p] ??= {id: a.p, team: tid, games: 0, goals: 0, sa: 0, sg: 0, warn: 0, pen: 0, disq: 0, best: 0, nums: new Set()};
        x.games++; x.goals += a.g; x.sa += a.sa; x.sg += a.sg; x.warn += a.w; x.pen += a.pen; x.disq += a.d;
        x.best = Math.max(x.best, a.g); x.nums.add(a.nr);
      }
    }
  }
  // goals in the team's most recent game ("aktuell")
  const lastByTeam = {};
  for (const g of played()) { lastByTeam[g.home] = g; lastByTeam[g.guest] = g; }
  for (const x of Object.values(s)) {
    x.field = x.goals - x.sg; x.avg = x.games ? x.goals / x.games : 0; x.favg = x.games ? x.field / x.games : 0;
    x.spct = x.sa ? x.sg / x.sa : -1;
    const lg = lastByTeam[x.team]; const side = lg && (lg.home === x.team ? "home" : "guest");
    const a = lg && lg.lineups[side].find(v => v.p === x.id);
    x.last = a ? a.g : null;
  }
  return s;
}

// ---------- charts ----------
function barChart(items, {h = 180, stacks, colors, labels, grouped = false}) {
  const w = Math.max(520, items.length * (grouped ? 56 : 34)), pad = 26, top = 16;
  const max = Math.max(1, ...items.map(i => grouped ? Math.max(...stacks.map(k => i[k])) : stacks.reduce((a, k) => a + i[k], 0)));
  const bw = (w - pad - 10) / items.length;
  let out = `<svg viewBox="0 -${top} ${w} ${h + 34 + top}" width="100%" role="img">`;
  for (let v = 0; v <= max; v += Math.max(1, Math.ceil(max / 5))) {
    const y = h - v / max * (h - 10);
    out += `<line x1="${pad}" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad - 6}" y="${y + 4}" text-anchor="end">${v}</text>`;
  }
  items.forEach((it, i) => {
    const x = pad + i * bw + 3;
    if (grouped) {
      const sw = (bw - 6) / stacks.length;
      stacks.forEach((k, j) => {
        const bh = it[k] / max * (h - 10), sx = x + j * sw;
        out += `<rect x="${sx}" y="${h - bh}" width="${sw - 2}" height="${bh}" fill="${colors[j]}" rx="2"><title>${it[k]} ${labels[j]}</title></rect>`;
        if (it[k]) out += `<text x="${sx + (sw - 2) / 2}" y="${h - bh - 4}" text-anchor="middle" style="fill:var(--text)">${it[k]}</text>`;
      });
    } else {
      let y = h;
      stacks.forEach((k, j) => {
        const bh = it[k] / max * (h - 10);
        if (bh > 0) out += `<rect x="${x}" y="${y - bh}" width="${bw - 6}" height="${bh}" fill="${colors[j]}" rx="2"><title>${it.title ? esc(it.title) + ": " : ""}${it[k]} ${labels[j]}</title></rect>`;
        y -= bh;
      });
      const total = stacks.reduce((a, k) => a + it[k], 0);
      if (total) out += `<text x="${x + (bw - 6) / 2}" y="${y - 4}" text-anchor="middle" style="fill:var(--text);font-weight:700">${total}</text>`;
    }
    out += `<text x="${x + (bw - 6) / 2}" y="${h + 16}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return out + `</svg><div class="legend">${labels.map((l, j) => `<span><i style="background:${colors[j]}"></i>${l}</span>`).join("")}</div>`;
}
function gameLen() {
  if (L._len) return L._len;
  let mx = 0;
  for (const g of L.games) for (const e of g.events || []) mx = Math.max(mx, +e[0].split(":")[0]);
  return (L._len = [40, 50, 60].find(x => mx <= x) || 60);
}
function scoreChart(g) {
  const len = gameLen();
  const pts = [[0, 0, 0]];
  for (const e of g.events) if (e[1] != null) { const [m, s] = e[0].split(":").map(Number); pts.push([m + s / 60, e[1], e[2]]); }
  const end = Math.max(len, pts[pts.length - 1][0]);
  pts.push([end, g.hg, g.gg]);
  const w = 640, h = 220, pad = 30, maxD = Math.max(3, ...pts.map(p => Math.abs(p[1] - p[2])));
  const X = t => pad + t / end * (w - pad - 8), Y = d => h / 2 - d / maxD * (h / 2 - 14);
  let path = `M${X(0)},${Y(0)}`;
  for (let i = 1; i < pts.length; i++) path += ` L${X(pts[i][0])},${Y(pts[i - 1][1] - pts[i - 1][2])} L${X(pts[i][0])},${Y(pts[i][1] - pts[i][2])}`;
  let out = `<svg viewBox="0 0 ${w} ${h + 20}" width="100%" role="img"><defs>
    <clipPath id="cTop"><rect x="0" y="0" width="${w}" height="${h / 2}"/></clipPath>
    <clipPath id="cBot"><rect x="0" y="${h / 2}" width="${w}" height="${h / 2}"/></clipPath></defs>`;
  for (let m = 0; m <= end; m += 10) out += `<line x1="${X(m)}" x2="${X(m)}" y1="6" y2="${h - 6}" stroke="var(--line)"/><text x="${X(m)}" y="${h + 12}" text-anchor="middle">${m}'</text>`;
  out += `<line x1="${X(len / 2)}" x2="${X(len / 2)}" y1="6" y2="${h - 6}" stroke="var(--line)" stroke-dasharray="4 3" stroke-width="2"/>`;
  for (const d of [-maxD, 0, maxD]) out += `<text x="${pad - 6}" y="${Y(d) + 4}" text-anchor="end">${d > 0 ? "+" + d : d < 0 ? "+" + -d : 0}</text>`;
  out += `<line x1="${pad}" x2="${w - 8}" y1="${h / 2}" y2="${h / 2}" stroke="var(--muted)"/>`;
  const area = `${path} L${X(end)},${h / 2} L${X(0)},${h / 2} Z`;
  out += `<path d="${area}" fill="var(--home)" opacity=".35" clip-path="url(#cTop)"/><path d="${area}" fill="var(--guest)" opacity=".35" clip-path="url(#cBot)"/>`;
  out += `<path d="${path}" fill="none" stroke="var(--text)" stroke-width="1.5"/>`;
  out += `<text x="${pad + 4}" y="16" style="fill:var(--home);font-weight:700">${esc(T[g.home]?.short)} führt</text><text x="${pad + 4}" y="${h - 8}" style="fill:var(--guest);font-weight:700">${esc(T[g.guest]?.short)} führt</text>`;
  return out + "</svg>";
}
function minuteBuckets(filterFn) {
  const n = gameLen() / 10;
  const b = Array.from({length: n}, (_, i) => ({label: `${i * 10 + 1}-${i * 10 + 10}'`, a: 0, b: 0}));
  for (const g of played()) for (const e of g.events) {
    if (e[3] !== "goal" && e[3] !== "7m_goal") continue;
    const r = filterFn(g, e); if (!r) continue;
    const [m, s] = e[0].split(":").map(Number);
    b[Math.min(n - 1, Math.floor((m * 60 + s) / 600))][r]++;

  return b;
}

function sortPlayers(list, {key, asc}) {
  const val = x => key === "name" ? P[x.id].name : key === "team" ? teamName(x.team) : (x[key] ?? -1);
  return list.sort((a, b) => {
    const va = val(a), vb = val(b);
    const c = typeof va === "string" ? va.localeCompare(vb, "de") : va - vb;
    return (asc ? c : -c) || b.goals - a.goals || a.games - b.games || P[a.id].name.localeCompare(P[b.id].name, "de");
  });
}
function cell(x, k, sortKey) {
  const cls = k === sortKey ? ' class="sortcol"' : "";

    case "name": return `<td class="l name">${playerLink(x.id)} <span class="tm">#${[...x.nums].join("/")}</span></td>`;
    case "team": return `<td class="l">${teamLink(x.team, true)}</td>`;
    case "avg": case "favg": return `<td${cls}>${fmt1(x[k])}</td>`;
    case "spct": return `<td${cls}>${x.sa ? pct(x.sg, x.sa) : "–"}</td>`;
    case "last": return `<td${cls}>${x.last ?? "–"}</td>`;

  }
}
function playerTable(list, {showTeam = true, totals = true, id = "pt"} = {}) {
  const cols = COLS.filter(c => showTeam || c.k !== "team");

  let html = `<div class="tablewrap"><table id="${id}"><thead><tr>${cols.map(c => `<th class="${c.cls || ""} ${c.k === key ? "sorted" + (asc ? " asc" : "") : ""}" data-k="${c.nosort ? "" : c.k}" ${c.title ? `title="${c.title}"` : ""}>${c.t}</th>`).join("")}</tr></thead><tbody>`;
  if (!list.length) html += `<tr><td colspan="${cols.length}" class="empty">Keine Spieler gefunden.</td></tr>`;
  let rank = 0, prev = null;
  list.forEach((x, i) => {
    const v = x[key]; if (v !== prev) rank = i + 1; prev = v;
    html += `<tr class="${state.favs.has(x.team) ? "fav" : ""}">` + cols.map(c =>
      c.k === "rank" ? `<td class="l muted">${["name", "team"].includes(key) ? i + 1 : rank}</td>` :
      c.k === "cmp" ? `<td class="l"><input type="checkbox" data-cmp="${x.id}" ${state.compare.has(x.id) ? "checked" : ""} title="Zum Vergleich auswählen"></td>` :
      cell(x, c.k, key)).join("") + "</tr>";
  });
  html += "</tbody>";
  if (totals && list.length) {

    html += `<tfoot><tr>${cols.map(c => c.k === "name" ? `<td class="l">Gesamt (${list.length} Spieler)</td>` : c.k === "spct" ? `<td>${pct(t.sg, t.sa)}</td>` : `<td>${t[c.k] ?? ""}</td>`).join("")}</tr></tfoot>`;
  }
  return html + "</table></div>";
}
function bindTable(root, rerender) {
  root.querySelectorAll("th[data-k]").forEach(th => th.dataset.k && th.addEventListener("click", () => {

        <div class="card"><div class="k">Tore / Spiel</div><div class="v">${pg.length ? fmt1(gf / pg.length) : "–"}</div><div class="d">${gf} Tore gesamt</div></div>
        <div class="card"><div class="k">Gegentore / Spiel</div><div class="v">${pg.length ? fmt1(ga / pg.length) : "–"}</div><div class="d">${ga} Gegentore gesamt</div></div>
        <div class="card"><div class="k">7m-Quote</div><div class="v">${pct(sg, sa)}</div><div class="d">${sg} von ${sa} verwandelt</div></div>
        <div class="card"><div class="k">Zeitstrafen / Spiel</div><div class="v">${pg.length ? fmt1(pen / pg.length) : "–"}</div><div class="d">${pen} Zeitstrafen gesamt</div></div>
        <div class="card"><div class="k">Eingesetzte Spieler</div><div class="v">${s.length}</div><div class="d">${s.filter(x => x.goals).length} verschiedene Torschützen</div></div>
      </div>
      <h2>Spieler</h2>${playerTable(s, {showTeam: false})}
      <h2>Tore & Gegentore nach Spielminute</h2><div class="panel">${barChart(minuteBuckets((g, e) => (g.home === id || g.guest === id) ? (g[e[4]] === id ? "a" : "b") : null), {stacks: ["a", "b"], colors: ["var(--win)", "var(--loss)"], labels: ["Tore", "Gegentore"], grouped: true})}</div>
      <h2>Spiele</h2>${gameList(games)}`;
    bindTable(app, render);
    $("#favBtn").addEventListener("click", () => { fav ? state.favs.delete(id) : state.favs.add(id); store.set("favs", [...state.favs]); render(); });
  };
  render();
};

views.player = (id) => {
  id = +id; const p = P[id]; if (!p) return notFound();
  const s = aggregate("all")[id];
  const all = Object.values(aggregate("all")).sort((a, b) => b.goals - a.goals);
  const rank = all.findIndex(x => x.goals === s.goals) + 1;
  const teamRank = all.filter(x => x.team === p.team).findIndex(x => x.goals === s.goals) + 1;
  const rows = [];
  for (const g of played()) for (const side of ["home", "guest"]) { const a = g.lineups[side].find(v => v.p === id); if (a) rows.push({g, side, a}); }
  const items = rows.map(r => ({label: fdate(r.g.date, false).slice(0, 5), title: `${T[r.g[r.side === "home" ? "guest" : "home"]].short}`, f: r.a.g - r.a.sg, s: r.a.sg}));
  const mins = minuteBuckets((g, e) => e[5] === id ? (e[3] === "goal" ? "a" : "b") : null);
  $("#app").innerHTML = `<h1>${esc(p.name)}</h1>
    <div class="chips"><span class="chip">${teamLink(p.team)}</span><span class="chip">Trikot #${[...s.nums].join(" / ")}</span><span class="chip">${esc(L.name)} ${esc(L.season)}</span>
    <span class="chip">Platz ${rank} der Torschützenliste</span><span class="chip">Nr. ${teamRank} im Team</span></div>
    <div class="cards">
      <div class="card"><div class="k">Spiele</div><div class="v">${s.games}</div></div>
      <div class="card"><div class="k">Tore</div><div class="v">${s.goals}</div><div class="d">Ø ${fmt1(s.avg)} pro Spiel</div></div>
      <div class="card"><div class="k">Feldtore</div><div class="v">${s.field}</div><div class="d">Ø ${fmt1(s.favg)} pro Spiel</div></div>
      <div class="card"><div class="k">7m</div><div class="v">${s.sg}/${s.sa}</div><div class="d">${s.sa ? pct(s.sg, s.sa) + " Quote" : "keine Würfe"}</div></div>
      <div class="card"><div class="k">Zeitstrafen</div><div class="v">${s.pen}</div><div class="d">${s.warn} Verw. · ${s.disq} Disq.</div></div>
      <div class="card"><div class="k">Bestwert</div><div class="v">${s.best}</div><div class="d">Tore in einem Spiel</div></div>
    </div>
    <div class="grid2">
      <div><h2>Tore pro Spiel</h2><div class="panel">${barChart(items, {stacks: ["f", "s"], colors: ["var(--accent)", "var(--home)"], labels: ["Feldtore", "7m-Tore"]})}</div></div>
      <div><h2>Tore nach Spielminute</h2><div class="panel">${barChart(mins, {stacks: ["a", "b"], colors: ["var(--accent)", "var(--home)"], labels: ["Feldtore", "7m-Tore"]})}</div></div>
    </div>
    <h2>Einsätze</h2>
    <div class="tablewrap"><table><thead><tr><th class="l">Datum</th><th class="l">Gegner</th><th class="l"></th><th>Ergebnis</th><th>Nr</th><th>Tore</th><th>Feld</th><th>7m</th><th>2'</th><th>Verw.</th><th>Disq.</th></tr></thead><tbody>
    ${rows.map(({g, side, a}) => { const opp = side === "home" ? g.guest : g.home; const r = resultFor(g, p.team);
      return `<tr><td class="l">${fdate(g.date)}</td><td class="l">${side === "home" ? "vs." : "@"} ${teamLink(opp)}</td><td class="l"><span class="res ${r}">${r}</span></td><td><a class="link" href="#/game/${g.id}">${g.hg}:${g.gg}</a></td><td>${esc(a.nr)}</td><td><b>${a.g}</b></td><td>${a.g - a.sg}</td><td>${a.sa ? a.sg + "/" + a.sa : "–"}</td><td>${a.pen || ""}</td><td>${a.w ? "●" : ""}</td><td>${a.d ? "●" : ""}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="muted small">Spieler werden über Name + Mannschaft identifiziert. Gleichnamige Spieler in verschiedenen Mannschaften werden getrennt geführt.</p>`;
};

views.game = (gid) => {
  const g = G[gid]; if (!g) return notFound();
  if (!g.parsed) { $("#app").innerHTML = `<div class="panel empty">Für dieses Spiel liegt noch kein Spielbericht vor.</div>`; return; }
  const box = side => {
    const list = g.lineups[side];
    const sum = k => list.reduce((a, x) => a + x[k], 0);
    const unattr = g.events.filter(e => e[4] === side && !e[5] && (e[3] === "goal" || e[3] === "7m_goal")).length;
    return `<div class="tablewrap"><table><thead><tr><th class="l">Nr</th><th class="l">Name</th><th>Tore</th><th>7m</th><th>2'</th><th>V</th><th>D</th></tr></thead><tbody>
      ${list.map(a => `<tr><td class="l muted">${esc(a.nr)}</td><td class="l name">${playerLink(a.p)}</td><td><b>${a.g || ""}</b></td><td>${a.sa ? a.sg + "/" + a.sa : ""}</td><td>${a.pen || ""}</td><td>${a.w ? "●" : ""}</td><td>${a.d ? "●" : ""}</td></tr>`).join("")}
      ${unattr ? `<tr><td></td><td class="l muted" title="Im Spielbericht ohne Spielername erfasst">ohne Spielerzuordnung</td><td><b>${unattr}</b></td><td></td><td></td><td></td><td></td></tr>` : ""}
      </tbody><tfoot><tr><td></td><td class="l">Gesamt</td><td>${sum("g") + unattr}</td><td>${sum("sg")}/${sum("sa")}</td><td>${sum("pen")}</td><td>${sum("w")}</td><td>${sum("d")}</td></tr></tfoot></table></div>
      ${g.officials[side].length ? `<p class="muted small">Offizielle: ${g.officials[side].map(o => `${o.code}: ${esc(o.name)}`).join(" · ")}</p>` : ""}`;
  };
  const label = {goal: "Tor", "7m_goal": "7m-Tor", "7m_miss": "7m verworfen", "2min": "2 Minuten", warning: "Verwarnung", disq: "Disqualifikation", timeout: "Auszeit", number_change: "Trikotwechsel"};
  const badge = {"7m_goal": "b-7m", "7m_miss": "b-miss", "2min": "b-2min", warning: "b-warn", disq: "b-disq", timeout: "b-to"};
  // biggest lead per team & longest run
  let maxH = 0, maxG = 0, run = {n: 0}, cur = {side: null, n: 0};
  for (const e of g.events) { if (e[1] == null) continue; maxH = Math.max(maxH, e[1] - e[2]); maxG = Math.max(maxG, e[2] - e[1]);
    if (e[3] === "goal" || e[3] === "7m_goal") { cur = cur.side === e[4] ? {side: e[4], n: cur.n + 1} : {side: e[4], n: 1}; if (cur.n > run.n) run = {...cur}; } }
  const app = $("#app");
  const st = {filter: "all"};
  const renderTimeline = () => {
    const ev = g.events.filter(e => st.filter === "all" || (st.filter === "goals" ? ["goal", "7m_goal", "7m_miss"].includes(e[3]) : ["2min", "warning", "disq", "timeout"].includes(e[3])));
    $("#tl").innerHTML = ev.map(e => {
      const who = e[5] ? `${playerLink(e[5])} <span class="muted small">(${esc(e[6])})</span>` : e[3] === "timeout" ? esc(teamName(g[e[4]])) : (e[3] === "goal" || e[3] === "7m_goal") && e[4] ? `<span class="muted">${esc(teamName(g[e[4]]))} – ohne Spielerzuordnung</span>` : esc(e[7] || "");
      const offName = !e[5] && e[6] ? ` <span class="muted small">Offizieller ${esc(e[6])}, ${esc(teamName(g[e[4]]))}</span>` : "";
      return `<div class="ev ${e[4] || ""}"><span class="t">${e[0]}</span><span class="sc">${e[1] != null ? e[1] + ":" + e[2] : ""}</span><span>${label[e[3]] || ""}${badge[e[3]] ? ` <span class="badge ${badge[e[3]]}">${e[3] === "2min" ? "2'" : e[3] === "warning" ? "Gelb" : e[3] === "disq" ? "Rot" : e[3] === "7m_goal" ? "7m" : e[3] === "7m_miss" ? "7m ✗" : "T"}</span>` : ""} ${who}${offName}</span></div>`;
    }).join("") || `<div class="empty">Keine Ereignisse.</div>`;
    app.querySelectorAll("#tlf button").forEach(b => b.classList.toggle("on", b.dataset.v === st.filter));
  };
  app.innerHTML = `<div class="panel scoreboard">
      <div><div class="team">${teamLink(g.home)}</div><div class="muted small">Heim</div></div>
      <div><div class="big">${g.hg}:${g.gg}</div><div class="muted">Halbzeit ${g.hh}:${g.gh}</div></div>
      <div><div class="team">${teamLink(g.guest)}</div><div class="muted small">Gast</div></div>
    </div>
    <div class="chips" style="justify-content:center"><span class="chip">${fdate(g.date)} · ${esc(g.time)}</span><span class="chip">Spiel-Nr. ${esc(g.no)}</span><span class="chip">${esc(g.venue)}, ${esc(g.town)}</span>
      ${g.spectators ? `<span class="chip">${g.spectators} Zuschauer</span>` : ""}<span class="chip"><a href="${esc(g.report)}" target="_blank" rel="noopener">Spielbericht (PDF) ↗</a></span></div>
    <div class="cards">
      <div class="card"><div class="k">Höchste Führung Heim</div><div class="v">${maxH ? "+" + maxH : "–"}</div></div>
      <div class="card"><div class="k">Höchste Führung Gast</div><div class="v">${maxG ? "+" + maxG : "–"}</div></div>
      <div class="card"><div class="k">Längster Lauf</div><div class="v">${run.n ? run.n + ":0" : "–"}</div><div class="d">${run.side ? esc(teamName(g[run.side])) : ""}</div></div>
      <div class="card"><div class="k">Zeitstrafen</div><div class="v">${g.lineups.home.reduce((a, x) => a + x.pen, 0)} : ${g.lineups.guest.reduce((a, x) => a + x.pen, 0)}</div><div class="d">Spieler Heim : Gast</div></div>
      <div class="card"><div class="k">7m</div><div class="v">${g.lineups.home.reduce((a, x) => a + x.sg, 0)}/${g.lineups.home.reduce((a, x) => a + x.sa, 0)} : ${g.lineups.guest.reduce((a, x) => a + x.sg, 0)}/${g.lineups.guest.reduce((a, x) => a + x.sa, 0)}</div><div class="d">Tore/Versuche Heim : Gast</div></div>
    </div>
    <h2>Spielverlauf</h2><div class="panel">${scoreChart(g)}</div>
    <div class="grid2"><div><h2>${esc(teamName(g.home))}</h2>${box("home")}</div><div><h2>${esc(teamName(g.guest))}</h2>${box("guest")}</div></div>
    <h2>Ticker</h2><div class="toolbar"><div class="seg" id="tlf"><button data-v="all">Alle</button><button data-v="goals">Tore & 7m</button><button data-v="pen">Strafen & Auszeiten</button></div></div>
    <div class="panel timeline" id="tl"></div>`;
  app.querySelectorAll("#tlf button").forEach(b => b.addEventListener("click", () => { st.filter = b.dataset.v; renderTimeline(); }));
  renderTimeline();
};

views.vergleich = (ids) => {
  const list = (ids || "").split(",").map(Number).filter(i => P[i]);
  if (!list.length) return notFound();
  const s = aggregate("all");
  const metrics = [["games", "Spiele", 1], ["goals", "Tore", 1], ["avg", "Tore / Spiel", 1, fmt1], ["field", "Feldtore", 1], ["favg", "Feldtore / Spiel", 1, fmt1],
    ["sg", "7m-Tore", 1], ["sa", "7m geworfen", 0], ["spct", "7m-Quote", 1, v => v < 0 ? "–" : Math.round(v * 100) + " %"], ["best", "Bestwert (Tore)", 1], ["pen", "Zeitstrafen", -1], ["warn", "Verwarnungen", -1], ["disq", "Disqualifikationen", -1]];
  const colors = ["var(--accent)", "var(--home)", "var(--win)", "var(--guest)"];
  // cumulative goals by matchday index of each player
  const series = list.map(id => { let c = 0; const pts = [0]; for (const g of played()) for (const side of ["home", "guest"]) { const a = g.lineups[side].find(v => v.p === id); if (a) { c += a.g; pts.push(c); } } return pts; });
  const w = 640, h = 220, pad = 30, maxX = Math.max(...series.map(s => s.length - 1), 1), maxY = Math.max(...series.flat(), 1);
  let svg = `<svg viewBox="0 0 ${w} ${h + 20}" width="100%">`;
  for (let i = 0; i <= maxX; i++) svg += `<text x="${pad + i / maxX * (w - pad - 10)}" y="${h + 14}" text-anchor="middle">${i}</text>`;
  for (let v = 0; v <= maxY; v += Math.max(1, Math.ceil(maxY / 5))) { const y = h - v / maxY * (h - 10); svg += `<line x1="${pad}" x2="${w - 10}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad - 6}" y="${y + 4}" text-anchor="end">${v}</text>`; }
  series.forEach((pts, j) => svg += `<polyline fill="none" stroke="${colors[j]}" stroke-width="2.5" points="${pts.map((v, i) => `${pad + i / maxX * (w - pad - 10)},${h - v / maxY * (h - 10)}`).join(" ")}"/>`);
  svg += `</svg><div class="legend">${list.map((id, j) => `<span><i style="background:${colors[j]}"></i>${esc(P[id].name)}</span>`).join("")}<span>x-Achse: Einsätze</span></div>`;
  $("#app").innerHTML = `<h1>Spielervergleich</h1><div class="sub">${esc(L.name)} ${esc(L.season)}</div>
    <div class="tablewrap"><table><thead><tr><th class="l"></th>${list.map(id => `<th>${playerLink(id)}<div class="tm" style="text-transform:none">${esc(T[P[id].team].short)}</div></th>`).join("")}</tr></thead><tbody>
    ${metrics.map(([k, l, dir, f]) => { const vals = list.map(id => s[id][k]); const best = dir === 0 ? null : (dir > 0 ? Math.max(...vals) : Math.min(...vals));
      return `<tr><td class="l muted">${l}</td>${vals.map(v => `<td class="${list.length > 1 && v === best ? "best" : ""}">${f ? f(v) : v}</td>`).join("")}</tr>`; }).join("")}
    </tbody></table></div>
    <h2>Torentwicklung (kumuliert)</h2><div class="panel">${svg}</div>`;
};

function notFound() { $("#app").innerHTML = `<div class="panel empty">Seite nicht gefunden. <a class="link" href="#/spieler">Zur Übersicht</a></div>`; }

// ---------- routing / chrome ----------
const LIST_VIEWS = ["spieler", "tabelle", "spiele", "liga"];
const OWNER = {team: {}, player: {}, game: {}};   // entity id -> league
const GENDER = {M: "Männer", F: "Frauen", J: "Jugend"};
const lgGroup = l => { const p = l.short.split("-")[0]; return p === "M" || p === "F" ? p : "J"; };
const leagueLabel = l => {
  const base = l.short.replace(/^[A-Za-z0-9]+-/, "").replace(/-[A-Z]+$/, "").replace(/^(\d)BK/, "$1. BK").replace(/-/g, " ");
  return lgGroup(l) === "J" ? `${l.short.split("-")[0]} ${base}` : base;
};
function ownerOf(view, arg) {
  if (!arg) return null;
  if (view === "team") return OWNER.team[arg];
  if (view === "player") return OWNER.player[arg];
  if (view === "game") return OWNER.game[arg];
  if (view === "vergleich") return OWNER.player[arg.split(",")[0]];
  return null;
}
function renderLeagueNav(view) {
  const nav = $("#leagues");
  if (DATA.leagues.length < 2) { nav.style.display = "none"; return; }
  const target = LIST_VIEWS.includes(view) ? view : "spieler";
  const groups = {};
  for (const g of Object.keys(GENDER)) for (const l of DATA.leagues) if (lgGroup(l) === g) (groups[g] ??= []).push(l);
  for (const ls of Object.values(groups)) ls.sort((a, b) => Number(!!a.nav_end) - Number(!!b.nav_end));
  nav.innerHTML = Object.entries(groups).map(([g, ls]) => `<div class="lgrow"><b>${esc(GENDER[g] || g)}</b>${ls.map((l, i) => {
    const fav = l.teams.some(t => state.favs.has(t.id));
    const separator = i > 0 && l.nav_end && !ls[i - 1].nav_end ? '<span class="lgsep" role="separator" aria-orientation="vertical"></span>' : "";
    return `${separator}<a href="#/${encodeURIComponent(l.short)}/${target}" class="${l === L ? "active" : ""} ${fav ? "hasfav" : ""}" title="${esc(l.name)}">${esc(leagueLabel(l))}</a>`;
  }).join("")}</div>`).join("");
  nav.querySelector("a.active")?.scrollIntoView({block: "nearest", inline: "nearest"});
}
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  let lg = DATA.leagues.find(l => l.short === parts[0]);
  if (lg) parts.shift();
  const [view = "spieler", arg] = parts;
  lg = lg || ownerOf(view, arg);
  if (lg && lg !== L) { setLeague(lg.key); state.team = ""; }
  document.querySelectorAll("#tabs a").forEach(a => {
    a.href = `#/${encodeURIComponent(L.short)}/${a.dataset.tab}`;
    a.classList.toggle("active", a.dataset.tab === view);
  });
  $("#brand").href = `#/${encodeURIComponent(L.short)}/spieler`;
  renderLeagueNav(view);
  (views[view] || notFound)(arg);
  updateCmpBar();
  if (!["spieler"].includes(view)) window.scrollTo(0, 0);
}
function initSearch() {
  const q = $("#q"), box = $("#suggest");
  const allTeams = DATA.leagues.flatMap(l => l.teams.map(t => ({t, l})));
  const teamOf = Object.fromEntries(allTeams.map(x => [x.t.id, x.t]));
  const allPlayers = DATA.leagues.flatMap(l => l.players.map(p => ({p, l})));
  const multi = DATA.leagues.length > 1;
  const lgTag = l => multi ? ` · ${lgGroup(l) === "J" ? "" : GENDER[lgGroup(l)][0] + " "}${esc(leagueLabel(l))}` : "";
  const byCurrent = (a, b) => (b.l === L) - (a.l === L);
  let idx = -1;
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase(); idx = -1;
    if (v.length < 2) { box.style.display = "none"; return; }
    const ts = allTeams.filter(({t}) => t.name.toLowerCase().includes(v) || t.short.toLowerCase().includes(v)).sort(byCurrent).slice(0, 5)
      .map(({t, l}) => `<a href="#/team/${t.id}"><span>${esc(t.name)}</span><small>Mannschaft${lgTag(l)}</small></a>`);
    const ps = allPlayers.filter(({p}) => p.name.toLowerCase().includes(v)).sort(byCurrent).slice(0, 12)
      .map(({p, l}) => `<a href="#/player/${p.id}"><span>${esc(p.name)}</span><small>${esc(teamOf[p.team]?.short)}${lgTag(l)}</small></a>`);
    box.innerHTML = ts.concat(ps).join("") || `<div class="empty">Keine Treffer</div>`;
    box.style.display = "block";
  });
  q.addEventListener("keydown", e => {
    const items = [...box.querySelectorAll("a")]; if (!items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); idx = (idx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items.forEach((a, i) => a.classList.toggle("active", i === idx)); }
    if (e.key === "Enter") { (items[idx] || items[0]).click(); }
    if (e.key === "Escape") box.style.display = "none";
  });
  box.addEventListener("click", () => { box.style.display = "none"; q.value = ""; });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) box.style.display = "none"; });
}
function init() {
  document.documentElement.classList.remove("nojs");
  if (store.get("theme", "dark") === "light") document.documentElement.classList.add("light");
  $("#themeBtn").addEventListener("click", () => { const l = document.documentElement.classList.toggle("light"); store.set("theme", l ? "light" : "dark"); });
  for (const l of DATA.leagues) {
    l.teams.forEach(t => OWNER.team[t.id] = l);
    l.players.forEach(p => OWNER.player[p.id] = l);
    l.games.forEach(g => OWNER.game[g.id] = l);
  }
  setLeague(store.get("league", DATA.leagues[0].key));
  $("#cmpgo").addEventListener("click", () => { location.hash = "#/vergleich/" + [...state.compare].join(","); });
  $("#cmpclear").addEventListener("click", () => { state.compare.clear(); document.querySelectorAll("input[data-cmp]").forEach(c => c.checked = false); updateCmpBar(); });
  $("#foot").innerHTML = `Daten: <a class="link" href="https://www.handball4all.de" target="_blank" rel="noopener">handball4all</a> (Spielplan, Tabelle, Spielberichte). Statistiken automatisch aus den offiziellen Spielberichten erstellt – ohne Gewähr.
    Stand der Auswertung: ${new Date(DATA.generated).toLocaleString("de-DE")}. Inspiriert von handballstatistiken.de.`;
  initSearch();
  window.addEventListener("hashchange", route);
  route();
}
init();
</script>
</body>
