name: Update & deploy

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC (06:00 CET / 07:00 CEST)
  workflow_dispatch:       # "Run workflow" button for manual updates

permissions:
  contents: write          # commit newly parsed reports (data/parsed)
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape (only new match reports are downloaded)
        id: scrape
        continue-on-error: true   # still publish the leagues that worked
        run: python scrape.py

      - name: Build site
        run: python build_site.py _site

      - name: Save parse cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parsed
          if git diff --cached --quiet; then
            echo "No new reports"
          else
            git commit -m "Add $(git diff --cached --name-only | wc -l) parsed match report(s)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report scrape errors
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::At least one league failed to update - see the 'Scrape' step log."
          exit 1
